<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Gen Studios</title>
  <meta name="description" content="First Gen Studios — Generation X roots. Next-gen games.">
  <meta property="og:title" content="First Gen Studios">
  <meta property="og:description" content="Generation X roots. Next-gen games.">
  <meta property="og:image" content="https://firstgengames.com/logo.jpg">
  <link rel="icon" href="logo.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at center, #0a1e4a 0%, #030817 60%, #000 100%);
      color: #cfd8ea;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main img {
      display: block;
      width: 100%;
      max-width: 1536px;
      max-height: calc(100vh - 80px);
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 0 60px rgba(40, 110, 255, 0.35);
    }
    footer {
      text-align: center;
      padding: 14px 16px 20px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    footer a { color: #f2c14e; text-decoration: none; margin: 0 10px; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <img src="logo.jpg" alt="First Gen Studios — Generation X roots. Next-gen games.">
  </main>
  <footer>
    <a href="privacy.html">Privacy Policy</a> |
    <a href="mailto:info@firstgengames.com">info@firstgengames.com</a>
    <div style="margin-top:8px;opacity:.6">&copy; 2026 First Gen Studios</div>
  </footer>
</body>
</html>
